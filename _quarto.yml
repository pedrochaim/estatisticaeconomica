project:
  type: book
  output-dir: docs

book:
  title: "Estatística Econômica"
  author: "Pedro Chaim"
  date: "2025"
  page-navigation: true
  chapters:
    - index.qmd
    
    - part: "Notas de Aula"
      chapters:
        - capitulos/01-introducao.qmd
    
    - part: "Probabilidade"
      chapters: 
        - capitulos/03-elementos-probabilidade.qmd
    
    - part: "Exercícios"
      chapters:
        - exercicios/01-lista-revisao.qmd
    
    - references.qmd

  appendices:
    - apendices/notacao.qmd

bibliography: references.bib
callout-appearance: minimal

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-depth: 2
    code-link: true
    citations-hover: false
    footnotes-hover: false
    crossrefs-hover: false
    css: styles.css