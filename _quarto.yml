project:
  type: book
  output-dir: docs

book:
  title: "Estatística Econômica"
  author: "Pedro Chaim"
  date: "2025"
  page-navigation: true
  chapters:
    - index.qmd
    - part: "Estatística Descritiva"
      chapters:
        - capitulos/02-estatistica-descritiva.qmd
    
    - part: "Probabilidade"
      chapters: 
        - capitulos/03-elementos-probabilidade.qmd
        - capitulos/04-variaveis-aleatorias.qmd
        - capitulos/05-distribuicoes-discretas.qmd
        - capitulos/06-distribuicoes-continuas.qmd
        - capitulos/07-distribuicao-normal.qmd
    
    - part: "Inferência Estatística"
      chapters: 
        - capitulos/08-populacao-amostra.qmd
      
    - part: "Regressão Linear"
    
    - references.qmd

  appendices:
    - apendices/notacao.qmd

bibliography: references.bib
callout-appearance: minimal

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 4
    number-depth: 3
    code-link: true
    citations-hover: false
    footnotes-hover: false
    crossrefs-hover: false